<!doctype html>
<!-- Proto.Shelf social card source. Open in a browser at exactly
     1200x630 and screenshot, or run:
     npx playwright screenshot --viewport-size=1200,630 og-card-source.html og.png
     Edit the TILES array or the copy below to regenerate. -->
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#F2F0EA;font-family:Inter,sans-serif;
       overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
  .grid{position:absolute;top:-104px;right:-104px;display:grid;
        grid-template-columns:repeat(3,146px);gap:18px;
        transform:rotate(-12deg);transform-origin:top right}
  .t{width:146px;height:146px;border-radius:30px;color:#fff;display:flex;
     align-items:center;justify-content:center;font-weight:800;font-size:62px;letter-spacing:-.02em}
  .wrap{position:absolute;left:80px;bottom:74px;max-width:840px}
  h1{font-weight:800;font-size:98px;letter-spacing:-.045em;color:#141312;line-height:1}
  .dot{color:#2F7D5B}          /* delete this rule for the all-black wordmark */
  p{margin-top:20px;font-weight:400;font-size:29px;color:#6C6961}
  .foot{margin-top:44px;font-weight:600;font-size:18px;letter-spacing:.14em;
        color:#2F7D5B;text-transform:uppercase}
</style></head>
<body>
  <div class="grid" id="g"></div>
  <div class="wrap">
    <h1>Proto<span class="dot">.</span>Shelf</h1>
    <p>Free AI tools · startup credits · open-source alternatives</p>
    <div class="foot">Free tiers first — by Proto.Engineer</div>
  </div>
<script>
  const TILES = [['A','#4F7CC9'],['C','#7A5BB0'],['M','#C2456B'],
                 ['I','#A2563C'],['O','#4FAE7E'],['S','#C9A227'],
                 ['B','#4F7CC9'],['P','#7A5BB0'],['K','#C2456B']];
  g.innerHTML = TILES.map(([l,c]) =>
    `<div class="t" style="background:${c}">${l}</div>`).join('');
</script>
</body></html>
