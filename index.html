<style>
  :root{
    --bg:#F1F2F4;
    --tile:#FFFFFF;
    --ink:#0E1013;
    --muted:#868D96;
    --line:#E3E6EA;
    --free:#3F7A5C;
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --ui:"Inter",system-ui,sans-serif;
    --r:18px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:76px}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}

  .wrap{max-width:1100px;margin:0 auto;padding:0 22px}

  /* top bar */
  .bar{
    position:sticky;top:0;z-index:20;
    background:rgba(241,242,244,.82);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)
  }
  .bar-in{
    max-width:1100px;margin:0 auto;padding:0 22px;
    display:flex;align-items:center;gap:18px;height:60px
  }
  .mark{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.03em;flex:none}
  .seg{display:flex;flex:none;gap:2px;background:rgba(14,16,19,.06);border-radius:999px;padding:3px}
  .seg button{
    border:0;background:transparent;cursor:pointer;font-family:var(--ui);
    font-size:.72rem;font-weight:500;color:var(--muted);padding:4px 11px;border-radius:999px;transition:.15s
  }
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
  .chips::-webkit-scrollbar{display:none}
  .chips a{
    flex:none;font-size:.78rem;font-weight:500;color:var(--muted);
    padding:6px 12px;border-radius:999px;white-space:nowrap;transition:.18s
  }
  .chips a:hover{color:var(--ink);background:rgba(14,16,19,.05)}
  .chips a[aria-current="true"]{color:var(--ink);background:rgba(14,16,19,.07)}

  /* featured — our own site (Proto.Engineer paper palette) */
  .hero{margin:34px 0 -14px}
  .hero a{
    display:flex;align-items:center;gap:16px;
    background:#F3F0EA;color:#37261E;border:1px solid #DBD5C9;border-radius:var(--r);
    padding:18px 22px;transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s
  }
  .hero a:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(55,38,30,.45)}
  .hero img{width:42px;height:42px;border-radius:11px;object-fit:contain}
  .hero .t{display:flex;flex-direction:column;gap:2px;min-width:0}
  .hero .t b{font-family:var(--display);font-size:1.02rem;letter-spacing:-.02em}
  .hero .t span{font-size:.78rem;opacity:.7}
  .hero .go{margin-left:auto;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75;flex:none}

  /* search */
  .search{
    flex:1;min-width:80px;max-width:230px;
    border:1px solid var(--line);background:var(--tile);border-radius:999px;
    font-family:var(--ui);font-size:.78rem;color:var(--ink);
    padding:7px 14px;outline-offset:2px
  }
  .search::placeholder{color:var(--muted)}

  /* category */
  section{padding:52px 0 4px}
  .head{margin-bottom:20px}
  .head-top{display:flex;align-items:baseline;gap:14px}
  .head h2{
    font-family:var(--display);font-weight:700;
    font-size:clamp(1.6rem,4vw,2.15rem);letter-spacing:-.035em;margin:0;line-height:1
  }
  .head .rule{flex:1;height:1px;background:var(--line)}
  .head .n{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .kind{margin:8px 0 0;font-size:.87rem;color:var(--muted);font-weight:400}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .tile{
    position:relative;background:var(--tile);border:1px solid var(--line);
    border-radius:var(--r);padding:22px 14px 16px;
    display:flex;flex-direction:column;align-items:center;gap:13px;
    transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s,border-color .22s
  }
  .tile:hover,.tile:focus-visible{
    transform:translateY(-3px);border-color:#D5D9DF;
    box-shadow:0 10px 26px -14px rgba(14,16,19,.28)
  }
  .logo{
    width:44px;height:44px;object-fit:contain;display:block;
    transition:transform .22s cubic-bezier(.2,.7,.3,1)
  }
  .tile:hover .logo{transform:scale(1.06)}
  .mono{
    width:46px;height:46px;border-radius:11px;display:grid;place-items:center;
    font-family:var(--display);font-weight:700;font-size:1.25rem;color:#fff
  }
  .nm{font-size:.83rem;font-weight:500;letter-spacing:-.01em;text-align:center;line-height:1.25}
  .use{font-size:.66rem;color:var(--muted);text-align:center;line-height:1.35;margin-top:-7px}
  .free{
    position:absolute;top:10px;right:11px;
    font-size:.55rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--free);opacity:.72
  }
  .fork{position:absolute;top:9px;left:11px;color:var(--free);opacity:.85;display:block}

  /* fast-scroll ladder */
  .ladder{
    position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:15;
    display:flex;flex-direction:column;gap:2px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:999px;padding:6px 3px
  }
  .ladder a{
    width:28px;height:28px;display:grid;place-items:center;
    font-size:.58rem;font-weight:600;color:var(--muted);
    border-radius:50%;transition:.15s
  }
  .ladder a:hover{color:var(--ink);background:rgba(14,16,19,.06)}
  .ladder a[aria-current="true"]{color:#fff;background:var(--ink)}
  @media (max-width:900px){
    .ladder{right:4px;padding:4px 2px}
    .ladder a{width:24px;height:24px;font-size:.54rem}
  }
  @media (max-width:768px){.ladder{display:none}}

  /* alternatives modal */
  .ovl{
    position:fixed;inset:0;z-index:40;display:none;
    background:rgba(14,16,19,.44);backdrop-filter:blur(4px);
    align-items:center;justify-content:center;padding:20px
  }
  .ovl.on{display:flex}
  .sheet{
    background:var(--tile);border-radius:20px;max-width:430px;width:100%;
    max-height:82vh;overflow-y:auto;padding:24px 22px 18px;position:relative
  }
  .sheet .x{
    position:absolute;top:14px;right:14px;border:0;background:rgba(14,16,19,.05);
    width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.85rem;color:var(--muted)
  }
  .sheet .x:hover{color:var(--ink);background:rgba(14,16,19,.1)}

  .m-main .mt{min-width:0}

  .m-main .mt span{font-size:.76rem;color:var(--muted)}
  .m-main .open{

  }
  .m-h{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--free);margin:16px 0 6px;display:flex;align-items:center;gap:6px}
  .m-alt{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;transition:.15s}
  .m-alt:hover{background:rgba(14,16,19,.04)}
  .m-alt img,.m-alt .mono{width:30px;height:30px;border-radius:8px;font-size:.9rem}
  .m-alt .at{min-width:0}
  .m-alt .at b{font-size:.83rem;font-weight:500;display:block}
  .m-alt .at span{font-size:.7rem;color:var(--muted)}
  .m-alt .ar{margin-left:auto;color:var(--muted);font-size:.8rem;flex:none}

    padding:64px 0 40px;font-size:.72rem;color:var(--muted);
    display:flex;gap:16px;flex-wrap:wrap
  }
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--ink)}

  @media (max-width:640px){
    html{scroll-padding-top:118px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
    .tile{padding:17px 8px 13px;gap:10px;border-radius:15px}
    .logo,.mono{width:36px;height:36px;border-radius:9px}
    .nm{font-size:.73rem}
    .use{font-size:.58rem;margin-top:-5px}
    section{padding:38px 0 4px}
    .bar-in{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;gap:8px 10px}
    .seg{margin-left:auto}
    .seg button{padding:5px 9px;font-size:.66rem}
    .search{flex:1 1 100%;max-width:none;order:3;padding:8px 14px}
    .chips{flex:1 1 100%;order:4;margin-left:0}
    .hero a{padding:14px 16px;gap:12px}
    .hero .go{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .tile,.logo,.hero a{transition:none}
    .tile:hover,.hero a:hover{transform:none}
  }
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>

const DATA_BASE = "./data";   // swap for your bucket URL on deploy

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HUES = [212, 258, 340, 18, 150, 42];
const FORK = '<svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>';

// Paste your publishable key from logo.dev (starts with pk_).
// It is meant to be public, but lock it to your domain in the logo.dev dashboard.
// Leave "" and the page still works, just with rougher icons.
const LOGO_DEV_KEY = "";

// Real brand logos, best source first:
//  1. logo.dev      — the real company logo, fetched live by domain
//  2. Simple Icons  — official brand SVG, free, no key
//  3. site icon     — the company's own icon
//  4. letter tile   — last resort only
function sources(t){
  const s = [];
  if (LOGO_DEV_KEY) s.push(`https://img.logo.dev/${t.domain}?token=${LOGO_DEV_KEY}&size=128&format=png&retina=true`);
  if (t.icon)       s.push(`https://cdn.simpleicons.org/${t.icon}`);
  s.push(`https://icons.duckduckgo.com/ip3/${t.domain}.ico`);
  s.push(`https://www.google.com/s2/favicons?domain=${t.domain}&sz=128`);
  return s;
}

function logoImg(t, cls){
  const hue = HUES[[...t.name].reduce((a,c)=>a+c.charCodeAt(0),0) % HUES.length];
  const src = sources(t);
  return `<img class="${cls}" alt="" loading="lazy" src="${esc(src[0])}"
       data-src='${esc(JSON.stringify(src))}' data-step="0"
       data-letter="${esc(t.name[0])}" data-hue="${hue}">`;
}

const TOOLS = {};

function tile(t, slug){
  const key = slug + "/" + t.name;
  TOOLS[key] = t;
  const href = t.href || `https://${t.domain}`;
  const hasAlts = t.alts && t.alts.length;
  return `<a class="tile" href="${esc(href)}" target="_blank" rel="noopener"${hasAlts ? ` data-alts="${esc(key)}"` : ''}>
    ${t.free ? '<span class="free">free</span>' : ''}
    ${hasAlts ? `<span class="fork" title="Open-source alternatives — click tile to view">${FORK}</span>` : ''}
    ${logoImg(t, "logo")}
    <span class="nm">${esc(t.name)}</span>
    ${t.use ? `<span class="use">${esc(t.use)}</span>` : ''}
  </a>`;
}

// walk the source list on failure, letter tile only if every source misses
document.addEventListener("error", e => {
  const img = e.target;
  if (!img.classList || !(img.classList.contains("logo") || img.classList.contains("mlogo"))) return;
  if (!img.dataset.src) return;
  const list = JSON.parse(img.dataset.src);
  const next = +img.dataset.step + 1;
  if (next < list.length){
    img.dataset.step = next;
    img.src = list[next];
  } else {
    const d = document.createElement("div");
    d.className = "mono";
    d.textContent = img.dataset.letter.toUpperCase();
    d.style.background = `hsl(${img.dataset.hue} 46% 52%)`;
    img.replaceWith(d);
  }
}, true);

let CATS = [], UPDATED = "", FILTER = "all", QUERY = "";

function visible(t){
  if (FILTER === "oss"   && !t.oss) return false;
  if (FILTER === "cloud" &&  t.oss) return false;
  if (QUERY){
    const hay = (t.name + " " + (t.use||"") + " " + t.domain + " " +
      (t.alts||[]).map(a => a.name).join(" ")).toLowerCase();
    if (!hay.includes(QUERY)) return false;
  }
  return true;
}

function render(){
  const cats = CATS
    .map(c => ({...c, tools: c.tools.filter(visible)}))
    .filter(c => c.tools.length);

  document.getElementById("main").innerHTML = cats.map(c => `
    <section id="${esc(c.slug)}">
      <div class="head">
        <div class="head-top">
          <h2>${esc(c.name)}</h2>
          <span class="rule"></span>
          <span class="n">${c.tools.length}</span>
        </div>
        <p class="kind">${esc(c.kind || "")}</p>
      </div>
      <div class="grid">${c.tools.map(t => tile(t, c.slug)).join("")}</div>
    </section>`).join("");

  document.getElementById("chips").innerHTML =
    cats.map(c => `<a href="#${esc(c.slug)}">${esc(c.name)}</a>`).join("");

  document.getElementById("ladder").innerHTML =
    cats.map(c => `<a href="#${esc(c.slug)}" title="${esc(c.name)}" aria-label="${esc(c.name)}">${esc(c.lad || c.name.slice(0,2))}</a>`).join("");

  document.getElementById("foot").innerHTML =
    `<span>Updated ${esc(UPDATED || "—")}</span>` +
    `<a href="https://www.proto-engineer.com/" target="_blank" rel="noopener">A Proto.Engineer project</a>` +
    `<a href="https://logo.dev" target="_blank" rel="noopener">Logos provided by Logo.dev</a>`;

  const links = [...document.querySelectorAll(".chips a, .ladder a")];
  const spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(l =>
      l.setAttribute("aria-current", l.getAttribute("href") === "#" + e.target.id));
  }), {rootMargin:"-15% 0px -70% 0px"});
  document.querySelectorAll("section").forEach(s => spy.observe(s));
}

/* search */
const searchEl = document.getElementById("search");
searchEl.addEventListener("input", () => { QUERY = searchEl.value.trim().toLowerCase(); render(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
});

/* filter segments */
document.getElementById("seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  FILTER = b.dataset.f;
  document.querySelectorAll("#seg button").forEach(x =>
    x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  render();
});

/* open-source alternatives modal */
const ovl = document.getElementById("ovl"), sheet = document.getElementById("sheet");
let lastFocus = null;

function openModal(t){
  const href = t.href || `https://${t.domain}`;
  sheet.innerHTML = `
    <button class="x" aria-label="Close">✕</button>
    <div class="m-main">
      ${logoImg(t, "mlogo")}
      <span class="mt"><b>${esc(t.name)}</b><span>${esc(t.use || "")}</span></span>
      <a class="open" href="${esc(href)}" target="_blank" rel="noopener">Open site</a>
    </div>
    <div class="m-h">${FORK} Open-source alternatives</div>
    ${t.alts.map(a => {
      const hue = HUES[[...a.name].reduce((s,c)=>s+c.charCodeAt(0),0) % HUES.length];
      return `
      <a class="m-alt" href="https://${esc(a.domain)}" target="_blank" rel="noopener">
        <span class="mono" style="background:hsl(${hue} 46% 52%)">${esc(a.name[0].toUpperCase())}</span>
        <span class="at"><b>${esc(a.name)}</b><span>${esc(a.note || "")}</span></span>
        <span class="ar">→</span>
      </a>`;}).join("")}`;
  ovl.classList.add("on");
  lastFocus = document.activeElement;
  sheet.querySelector(".x").focus();
}
function closeModal(){
  ovl.classList.remove("on");
  if (lastFocus) lastFocus.focus();
}
document.addEventListener("click", e => {
  const tileEl = e.target.closest("[data-alts]");
  if (tileEl){ e.preventDefault(); openModal(TOOLS[tileEl.dataset.alts]); return; }
  if (e.target === ovl || e.target.closest(".x")) closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* boot: render the baked-in snapshot instantly, upgrade from data/ if present */
CATS = SEED.categories || []; UPDATED = SEED.updated || "";
render();
(async () => {
  try{
    const idx = await (await fetch(`${DATA_BASE}/index.json`,{cache:"no-cache"})).json();
    const cats = await Promise.all(idx.categories.map(c =>
      fetch(`${DATA_BASE}/${c.slug}.json`,{cache:"no-cache"}).then(r => r.json())));
    CATS = cats; UPDATED = idx.updated;
    render();
  }catch(err){ /* no data dir — the snapshot already rendered */ }
})();
</script>
